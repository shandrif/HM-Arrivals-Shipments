<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grumpy Puppy</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Grumpy&nbsp;Puppy</h1>
  <div class="stage">
    <canvas id="pup" width="840" height="840" aria-label="A grumpy 3D puppy in a red jumper whose head follows your cursor" role="img"></canvas>
    <div id="loading" class="loading"><span id="bar"></span><em>Waking the puppy…</em></div>
  </div>
  <p class="hint">Move your cursor. He’s watching. He’s not happy about it.</p>
</main>
<script src="puppy.js"></script>
</body>
</html>
